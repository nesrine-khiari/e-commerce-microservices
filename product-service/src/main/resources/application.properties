spring.application.name=Product-Service

spring.datasource.url=jdbc:mysql://localhost:3308/product
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=8080
axon.axonserver.servers=localhost:8124
axon.axonserver.context=default

# Event Store (JPA)
axon.eventstore.jpa.schema-generation.enabled=true


# Event Handling (Tracking Processor)
axon.eventhandling.processors.product.source=eventStore
axon.eventhandling.processors.product.initial-segment-count=1
axon.eventhandling.processors.product.mode=subscribing


# ===============================
# Eureka Client
# ===============================
eureka.client.enabled=true
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
logging.level.com.netflix.discovery=DEBUG
logging.level.org.springframework.cloud.netflix.eureka=DEBUG

# ===============================
# Resilience4j - Circuit Breaker
# ===============================
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=5s
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.eventConsumerBufferSize=10

resilience4j.circuitbreaker.configs.default.recordExceptions[0]=org.springframework.web.client.HttpServerErrorException
resilience4j.circuitbreaker.configs.default.recordExceptions[1]=java.util.concurrent.TimeoutException
resilience4j.circuitbreaker.configs.default.recordExceptions[2]=java.io.IOException

resilience4j.circuitbreaker.instances.productService.baseConfig=default
resilience4j.circuitbreaker.instances.userService.baseConfig=default
resilience4j.circuitbreaker.instances.userService.slidingWindowSize=20
resilience4j.circuitbreaker.instances.userService.failureRateThreshold=60

# ===============================
# Resilience4j - Retry
# ===============================
resilience4j.retry.configs.default.maxAttempts=3
resilience4j.retry.configs.default.waitDuration=500ms
resilience4j.retry.configs.default.enableExponentialBackoff=true
resilience4j.retry.configs.default.exponentialBackoffMultiplier=2

resilience4j.retry.configs.default.retryExceptions[0]=org.springframework.web.client.ResourceAccessException
resilience4j.retry.configs.default.retryExceptions[1]=java.util.concurrent.TimeoutException

resilience4j.retry.configs.default.ignoreExceptions[0]=java.lang.IllegalArgumentException

resilience4j.retry.instances.productService.baseConfig=default
resilience4j.retry.instances.userService.baseConfig=default
resilience4j.retry.instances.userService.maxAttempts=5
resilience4j.retry.instances.userService.waitDuration=1000ms

# ===============================
# Resilience4j - Rate Limiter
# ===============================
resilience4j.ratelimiter.configs.default.registerHealthIndicator=true
resilience4j.ratelimiter.configs.default.limitForPeriod=5
resilience4j.ratelimiter.configs.default.limitRefreshPeriod=1s
resilience4j.ratelimiter.configs.default.timeoutDuration=0s
resilience4j.ratelimiter.configs.default.eventConsumerBufferSize=100

resilience4j.ratelimiter.instances.productService.baseConfig=default
resilience4j.ratelimiter.instances.createProduct.limitForPeriod=3
resilience4j.ratelimiter.instances.createProduct.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.createProduct.timeoutDuration=0s

# ===============================
# Resilience4j - Time Limiter
# ===============================
resilience4j.timelimiter.configs.default.timeoutDuration=2s
resilience4j.timelimiter.configs.default.cancelRunningFuture=true

resilience4j.timelimiter.instances.productService.baseConfig=default

# ===============================
# Actuator / Management
# ===============================
management.endpoints.web.exposure.include=health,metrics,circuitbreakers,ratelimiters,retries
management.endpoint.health.show-details=always

management.health.circuitbreakers.enabled=true
management.health.ratelimiters.enabled=true

# ===============================
# Logging
# ===============================
logging.level.io.github.resilience4j=DEBUG
