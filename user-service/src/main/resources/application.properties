spring.application.name=User Service

server.port=8084

spring.datasource.url=jdbc:mysql://localhost:3306/user?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=lavieenrose

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Axon Server
axon.axonserver.servers=localhost:8124
axon.axonserver.context=default
# Event Store (JPA)
axon.eventstore.jpa.schema-generation.enabled=true

# Event Handling (Tracking Processor)
axon.eventhandling.processors.user.mode=subscribing
axon.eventhandling.processors.user.source=eventStore
axon.eventhandling.processors.user.initial-segment-count=1



# Increased timeouts to prevent "Timeout while executing request"
axoniq.axonserver.default-command-timeout=30000
axoniq.axonserver.command-timeout=60000

# Heartbeat tuning to reduce reconnect noise
axoniq.axonserver.heartbeat-interval=5000
axoniq.axonserver.heartbeat-timeout=15000

spring.config.import=configserver:http://localhost:8888

