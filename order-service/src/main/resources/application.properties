spring.application.name=order-service
spring.config.import=configserver:http://localhost:8888

# ===============================
# Resilience4j - Circuit Breaker
# ===============================
spring.cloud.openfeign.circuitbreaker.enabled=true
feign.client.config.default.connectTimeout=3000
feign.client.config.default.readTimeout=3000

resilience4j.circuitbreaker.instances.productCommand.failureRateThreshold=30
resilience4j.circuitbreaker.instances.productCommand.slidingWindowSize=5
resilience4j.circuitbreaker.instances.productCommand.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.productCommand.waitDurationInOpenState=10s
# Retry config
resilience4j.retry.instances.productCommand.maxAttempts=3
resilience4j.retry.instances.productCommand.waitDuration=500ms

# Rate Limiter - 5 requests per second
resilience4j.ratelimiter.instances.productCommand.limitForPeriod=5
resilience4j.ratelimiter.instances.productCommand.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.productCommand.timeoutDuration=0


logging.level.io.github.resilience4j=DEBUG
logging.level.org.springframework.cloud.openfeign=DEBUG
# Expose endpoints for monitoring
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,prometheus

# Enable Prometheus metrics export
management.metrics.export.prometheus.enabled=true

# Optional: show detailed health
management.endpoint.health.show-details=always


