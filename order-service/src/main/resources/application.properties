spring.application.name=Order Service

server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/order?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Axon Server
axon.axonserver.servers=localhost:8124
axon.axonserver.context=default

# Event Store (JPA)
axon.eventstore.jpa.schema-generation.enabled=true

# Event Handling (Tracking Processor)
axon.eventhandling.processors.order.source=eventStore
axon.eventhandling.processors.order.initial-segment-count=1
axon.eventhandling.processors.order.mode=subscribing

# Logging
logging.level.org.axonframework=DEBUG
logging.level.com.core=DEBUG

# ===============================
# Eureka Client
# ===============================
eureka.client.enabled=true
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
logging.level.com.netflix.discovery=DEBUG
logging.level.org.springframework.cloud.netflix.eureka=DEBUG
