# ===============================
# Application
# ===============================
spring.application.name=Payment Service
server.port=8086

# ===============================
# Datasource (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/payment
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# AXON CONFIGURATION
# ===============================

# Axon Server
axon.axonserver.servers=localhost:8124
axon.axonserver.context=default

# Event Store (JPA)
axon.eventstore.jpa.schema-generation.enabled=true

# Event Handling (Tracking Processor)
axon.eventhandling.processors.user.mode=subscribing
axon.eventhandling.processors.user.source=eventStore
axon.eventhandling.processors.user.initial-segment-count=1

# ===============================
# Eureka Client
# ===============================
eureka.client.enabled=true
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
logging.level.com.netflix.discovery=DEBUG
logging.level.org.springframework.cloud.netflix.eureka=DEBUG
