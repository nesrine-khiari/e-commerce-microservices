# ===============================
# Application
# ===============================
spring.application.name=payment-service
server.port=8086

# ===============================
# Database
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/payment_db?createDatabaseIfNotExist=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===============================
# Order Service URL
# ===============================
service.order.url=http://localhost:8081

# ===============================
# Feign Client
# ===============================
feign.client.config.default.connect-timeout=3000
feign.client.config.default.read-timeout=5000
feign.circuitbreaker.enabled=true

# ===============================
# RESILIENCE4J - Retry, CircuitBreaker, RateLimiter
# ===============================
resilience4j.retry.instances.orderService.max-attempts=3
resilience4j.retry.instances.orderService.wait-duration=500ms
resilience4j.retry.instances.orderService.enable-exponential-backoff=false
resilience4j.retry.instances.orderService.retry-exceptions[0]=feign.FeignException
resilience4j.retry.instances.orderService.retry-exceptions[1]=java.net.ConnectException
resilience4j.retry.instances.orderService.retry-exceptions[2]=java.net.SocketTimeoutException
resilience4j.retry.instances.orderService.retry-exceptions[3]=org.springframework.web.client.ResourceAccessException

resilience4j.circuitbreaker.instances.orderService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.orderService.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.orderService.slow-call-duration-threshold=3000ms
resilience4j.circuitbreaker.instances.orderService.wait-duration-in-open-state=5000ms
resilience4j.circuitbreaker.instances.orderService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.orderService.sliding-window-size=10
resilience4j.circuitbreaker.instances.orderService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.orderService.minimum-number-of-calls=5

resilience4j.ratelimiter.instances.orderService.limit-for-period=5
resilience4j.ratelimiter.instances.orderService.limit-refresh-period=1s
resilience4j.ratelimiter.instances.orderService.timeout-duration=200ms

# ===============================
# Axon – sans DCB (mode simple pour tests)
# ===============================
axon.axonserver.servers=localhost:8124
axon.axonserver.enabled=true
axon.distributed-command-bus.enabled=false
axon.eventhandling.processors.payments.mode=tracking
axon.eventhandling.tokenstore.jpa.enabled=true

# ===============================
# Logging
# ===============================
logging.level.com.paymentservice=INFO
logging.level.io.github.resilience4j=DEBUG
logging.level.io.github.resilience4j.circuitbreaker=DEBUG
logging.level.io.github.resilience4j.retry=DEBUG
logging.level.io.github.resilience4j.ratelimiter=DEBUG
logging.level.org.springframework.cloud.openfeign=DEBUG

# ===============================
# Actuator - exposer les endpoints pour Prometheus
# ===============================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.enable.all=true

# Remarque :
# Pas besoin de management.server.address ou management.server.port
# Actuator sera disponible sur le même port que l'application principale (8086)
