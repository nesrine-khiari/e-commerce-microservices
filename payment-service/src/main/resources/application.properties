# ===============================
# Application
# ===============================
spring.application.name=payment-service
server.port=8086

# ===============================
# Database
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/payment_db?createDatabaseIfNotExist=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# AXON FRAMEWORK
# ===============================
axon.axonserver.servers=localhost:8124
axon.axonserver.enabled=true

# processor payment en mode tracking
axon.eventhandling.processors.payments.mode=tracking

# activer token store JPA (obligatoire pour tracking)
axon.eventhandling.tokenstore.jpa.enabled=true

# ===============================
# Logging pour debug
# ===============================
logging.level.com.paymentservice=TRACE
logging.level.org.axonframework=DEBUG
logging.level.org.springframework.integration=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
